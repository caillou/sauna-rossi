pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,ts,mjs,astro,css,md,json,yaml,yml}"
      exclude:
        - "design_handoff_saunatankstelle/**"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,ts,mjs,astro,css,json}"
      exclude:
        - "design_handoff_saunatankstelle/**"
      run: pnpm biome check --write {staged_files}
      stage_fixed: true
    astro-check:
      run: pnpm astro check
